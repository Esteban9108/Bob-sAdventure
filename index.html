<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Programming Final Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="console">
        <div id="top-screen">
            <div id="player-column" class="screen-slice">
                <p>BOB</p>
                <div class="health-bar">
                    <div id="player-hp"class="health-fill"></div>
                </div>
                <span id="player-hp-num">100/100</span>
            </div>

            <div id="battle" class="screen-slice">
                Battle, what battle?
            </div>

            <div id="enemy-column" class="screen-slice">
                Enemy will appear soon...
            </div>
        </div>    
        <div id="bottom-screen">
            <div>Bottom Interface and cards.</div>
        </div>
        
    </main>
</body>
</html>
